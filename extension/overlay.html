<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MemoryNotes</title>
<link rel="stylesheet" href="editor/mn-editor.css">
<!-- No color-scheme meta on purpose: a mismatch with the host page would paint the frame opaque. -->
<style>
  /* --host-h: the page's viewport height (from content.js). 100vh here is the frame's own height, which follows the panel. */
  :root { --host-h: 800px; }
  html, body { margin: 0; background: transparent; }
  body { display: flex; justify-content: flex-end; }
  /* The frost itself is a backdrop-filter on the iframe (content.js): a cross-origin frame can't blur the page behind it. */
  /* Tints measured for ≥4.5:1 secondary text over white, dark and busy pages; dark needs .8 to stay legible over white pages. */
  .panel { --tint: rgba(246,245,241,.66); --card: rgba(255,255,255,.8); --field: rgba(255,255,255,.55); --fg: #1d1d1f; --mute: #3a3a3f; --line: rgba(0,0,0,.1);
    --edge: rgba(0,0,0,.14); --hover: rgba(0,0,0,.06); --accent: #f5b800; --accent-text: #8a5d00; --ring: #b07a00; --danger: #c4231c;
    color-scheme: light dark; /* form controls, scrollbars and Canvas follow the theme without painting the frame */
    box-sizing: border-box; flex: none; width: 340px; max-height: calc(var(--host-h) - 16px); display: flex; flex-direction: column;
    background: var(--tint); color: var(--fg); border: 1px solid var(--edge); border-radius: 14px; overflow: hidden;
    font: 13px/1.45 -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  @media (prefers-color-scheme: dark) {
    .panel { --tint: rgba(28,28,30,.8); --card: rgba(44,44,46,.82); --field: rgba(118,118,128,.18); --fg: #f5f5f7; --mute: #c7c7cc; --line: rgba(255,255,255,.1);
      --edge: rgba(255,255,255,.16); --hover: rgba(255,255,255,.08); --accent: #ffd60a; --accent-text: #ffd60a; --ring: #ffd60a; --danger: #ff6961; }
  }
  /* Opaque when the user asks for less transparency or more contrast, or blur is missing. */
  @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
    .panel { --tint: #f6f5f1; --card: #fff; --edge: rgba(0,0,0,.35); }
  }
  @media (prefers-color-scheme: dark) and ((prefers-reduced-transparency: reduce) or (prefers-contrast: more)) {
    .panel { --tint: #1c1c1e; --card: #2c2c2e; --edge: rgba(255,255,255,.4); }
  }
  @supports not (backdrop-filter: blur(1px)) {
    .panel { --tint: #f6f5f1; --card: #fff; }
    @media (prefers-color-scheme: dark) { .panel { --tint: #1c1c1e; --card: #2c2c2e; } }
  }
  .panel.expanded { width: 640px; }
  .panel.expanded:has(> .body:not([hidden])) { height: calc(var(--host-h) - 16px); }
  .panel .mn-editor { --mn-fg: var(--fg); --mn-muted: var(--mute); }

  header { display: flex; align-items: center; gap: 9px; padding: 10px 8px 8px 12px; }
  .site { width: 20px; height: 20px; flex: none; border-radius: 5px; display: grid; place-items: center; color: var(--mute); }
  .site img { width: 16px; height: 16px; }
  .site img:not([hidden]) + .globe { display: none; }
  .where { flex: 1; min-width: 0; }
  .where div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .host { font-weight: 600; }
  .count { color: var(--mute); font-weight: 400; margin-left: 5px; font-variant-numeric: tabular-nums; }
  .page-title { color: var(--mute); font-size: 11.5px; }
  .tools { display: flex; gap: 1px; }

  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .icon { width: 26px; height: 26px; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: 7px;
    background: none; color: var(--mute); font: 600 12.5px -apple-system, system-ui, sans-serif; cursor: default; }
  .icon:hover, .icon[aria-pressed="true"], .help-toggle[aria-expanded="true"] { background: var(--hover); color: var(--fg); }
  .format[aria-pressed="true"] { color: var(--accent-text); }
  .expand[aria-pressed="true"] .grow, .expand[aria-pressed="false"] .shrink,
  .collapse[aria-expanded="true"] .down, .collapse[aria-expanded="false"] .up { display: none; }
  :is(button, a, input):focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }

  .body { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .search-box { position: relative; margin: 0 12px 6px; }
  .search-box svg { position: absolute; left: 8px; top: 7px; width: 14px; height: 14px; color: var(--mute); pointer-events: none; }
  .search { box-sizing: border-box; width: 100%; font: inherit; color: var(--fg); background: var(--field); border: 0; border-radius: 8px;
    padding: 5px 8px 5px 28px; }
  .search::placeholder { color: var(--mute); }
  .search:focus-visible { outline-offset: 0; }

  .list { overflow-y: auto; padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; overscroll-behavior: contain; }
  .card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .card:focus-within { border-color: color-mix(in srgb, var(--accent) 70%, transparent); }
  /* Scroll the text, not the whole editor, so the toolbar stays put and the ✨ menu isn't clipped. */
  .card .mn-body { max-height: calc(var(--host-h) * .4); overflow-y: auto; }
  .expanded .card .mn-body { max-height: none; }
  /* titleLine's 1.75em title is sized for the app window; a step down suits a 340px card. */
  .card .mn-title-line .mn-content > :first-child { font-size: 1.3em; margin-bottom: .25em; }
  .where-link { display: inline-block; max-width: 100%; margin-bottom: 4px; color: var(--accent-text); font-size: 11.5px; font-weight: 500;
    text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: top; }
  .where-link:hover { text-decoration: underline; }
  .meta { display: flex; align-items: center; gap: 6px; min-height: 24px; margin-top: 4px; color: var(--mute); font-size: 11px; }
  .meta span { flex: 1; }
  .del { width: auto; min-width: 24px; height: 22px; padding: 0 4px; opacity: 0; transition: opacity .15s; }
  .card:hover .del, .del:focus-visible, .del.armed { opacity: 1; }
  .del:hover { color: var(--danger); }
  .del.armed { color: var(--danger); font-weight: 600; font-size: 11px; padding: 0 8px; }
  @media (hover: none) { .del { opacity: 1; } }

  .results .card { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: default; }
  .results .card:hover { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
  .r-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .snippet { color: var(--mute); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .snippet:empty { display: none; }
  .snippet.full { display: block; -webkit-line-clamp: unset; white-space: pre-wrap; user-select: text; color: var(--fg); }
  .results .meta { margin: 4px 0 0; min-height: 0; }

  .help { overflow-y: auto; padding: 0 12px 12px; font-size: 12px; }
  .help h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); margin: 10px 0 4px; }
  .help div { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .help kbd { flex: 0 0 44%; font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); }
  .help span { color: var(--mute); }

  .empty { padding: 14px 24px 18px; text-align: center; color: var(--mute); }
  .empty svg { width: 30px; height: 30px; color: var(--accent); stroke-width: 1.6; margin-bottom: 6px; }
  .empty strong { display: block; color: var(--fg); font-size: 14px; margin-bottom: 2px; }
  .no-results { padding: 12px; }
  .error { margin: 0 12px 8px; padding: 6px 10px; border-radius: 8px; color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--card)); }

  footer { padding: 8px 12px 12px; }
  .add { width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; height: 32px; border: 0; border-radius: 9px;
    font: 600 13px -apple-system, system-ui, sans-serif; color: #3d2a00; background: var(--accent); cursor: default; }
  .add:hover { filter: brightness(1.05); }
  .add:active { filter: brightness(.95); }
  @media (prefers-reduced-motion: reduce) { .del { transition: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="panel" role="complementary" aria-label="MemoryNotes">
    <header>
      <span class="site" aria-hidden="true"><img alt="" hidden><svg class="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
      <div class="where">
        <div><span class="host">Notes</span><span class="count"></span></div>
        <div class="page-title"></div>
      </div>
      <div class="tools">
        <button class="icon format" aria-label="Show formatting toolbar" aria-pressed="false" title="Formatting toolbar">Aa</button>
        <button class="icon help-toggle" aria-label="Keyboard shortcuts" aria-expanded="false" title="Keyboard shortcuts">?</button>
        <button class="icon expand" aria-label="Expand panel" aria-pressed="false" title="Expand panel">
          <svg class="grow" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
          <svg class="shrink" viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>
        </button>
        <button class="icon collapse" aria-label="Collapse notes" aria-expanded="true" title="Collapse">
          <svg class="up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>
          <svg class="down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <button class="icon close" aria-label="Close" title="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
    </header>
    <div class="body">
      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="search" type="search" placeholder="Search all notes" aria-label="Search all notes">
      </div>
      <div class="error" role="alert" hidden></div>
      <div class="list notes"></div>
      <div class="help" hidden></div>
      <div class="list results" hidden></div>
      <div class="empty">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9z"/><path d="M15 3v6h6"/></svg>
        <strong>No notes on this page yet</strong>
        Anything you write here comes back when you return.
      </div>
      <div class="empty no-results" hidden>No matching notes</div>
      <footer>
        <button class="add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New note</button>
      </footer>
    </div>
  </div>
  <script src="editor/mn-editor.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
