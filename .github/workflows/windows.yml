name: Windows app
# Builds and tests the Windows app (windows/, D86) on GitHub's Windows machines, x64 and Arm64, then opens it on each
# and takes a screenshot: the project has no Windows PC, so this is where the app first runs.
on:
  push:
    branches: [windows]
  pull_request:
    paths: ["windows/**", "editor/**", "app/editor.html", "extension/**", "VERSION", ".github/workflows/windows.yml"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, rid: win-x64 }
          - { runner: windows-11-arm, rid: win-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test windows/NoteAnywhere.slnx -c Release
      - name: Build the app
        run: dotnet publish windows/src/NoteAnywhere/NoteAnywhere.csproj -c Release -r ${{ matrix.rid }} --self-contained -o out
      - name: The MCP server (--mcp) end to end
        timeout-minutes: 5
        env:
          NOTEANYWHERE_DIR: ${{ runner.temp }}\mcp-store  # an empty scratch store, never anyone's notes
        run: python windows/scripts/test_mcp.py out\NoteAnywhere.exe
      - name: The browsers' host, started as Chrome and Firefox start it
        timeout-minutes: 10
        env:
          NOTEANYWHERE_DIR: ${{ runner.temp }}\host-store  # a scratch store, never anyone's notes
        run: python windows/scripts/test_host.py out\NoteAnywhere.exe
      - name: Open it and take screenshots
        shell: powershell
        run: |
          $env:NOTEANYWHERE_DIR = Join-Path $env:RUNNER_TEMP "store"  # a scratch store, never anyone's notes
          New-Item -ItemType Directory -Force shots | Out-Null
          $app = Start-Process out\NoteAnywhere.exe -ArgumentList "--seed-sample-notes" -PassThru
          Start-Sleep -Seconds 25
          if ($app.HasExited) {
            $log = Join-Path $env:NOTEANYWHERE_DIR "crash.log"
            if (Test-Path $log) { Get-Content $log }
            throw "NoteAnywhere quit by itself, exit code $($app.ExitCode)"
          }
          # By title: on a first launch the Welcome window opens too, and either could be the process's "main" window.
          & windows\scripts\Save-WindowShot.ps1 -ProcessId $app.Id -Title "NoteAnywhere" -Out "shots\main-${{ matrix.rid }}.png"
          & windows\scripts\Save-WindowShot.ps1 -ProcessId $app.Id -Title "Welcome to NoteAnywhere" -Out "shots\welcome-${{ matrix.rid }}.png"
          # Closing the notes window (WM_CLOSE, as its close button) keeps its place in windows.json; the dark launch below
          # opens it there.
          Add-Type -Namespace Probe -Name Win -MemberDefinition '[DllImport("user32.dll")] public static extern bool PostMessage(IntPtr w, uint m, IntPtr a, IntPtr b);'
          [void][Probe.Win]::PostMessage([WindowShot]::Find([uint32]$app.Id, "NoteAnywhere"), 0x10, [IntPtr]::Zero, [IntPtr]::Zero)
          Start-Sleep -Seconds 2
          $places = Join-Path $env:NOTEANYWHERE_DIR "windows.json"
          if (-not (Test-Path $places)) { throw "closing the notes window didn't keep its place" }
          Write-Host "windows.json: $(Get-Content $places -Raw)"
          Stop-Process -Id $app.Id
          # Dark (D85): the editor's light text has to sit on the window's dark background, not on white.
          $settings = Join-Path $env:NOTEANYWHERE_DIR "settings.json"
          $saved = Get-Content $settings -Raw | ConvertFrom-Json
          $saved.appearance = "dark"; $saved | ConvertTo-Json | Set-Content $settings
          $app = Start-Process out\NoteAnywhere.exe -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) {
            $log = Join-Path $env:NOTEANYWHERE_DIR "crash.log"
            if (Test-Path $log) { Get-Content $log }
            throw "NoteAnywhere quit by itself in dark mode, exit code $($app.ExitCode)"
          }
          & windows\scripts\Save-WindowShot.ps1 -ProcessId $app.Id -Title "NoteAnywhere" -Out "shots\main-dark-${{ matrix.rid }}.png"
          Stop-Process -Id $app.Id
          $saved.appearance = "system"; $saved | ConvertTo-Json | Set-Content $settings
      - name: The calendar and the graph, light and dark
        shell: powershell
        run: |
          # Its own scratch store, so dark mode set here never reaches the other steps' screenshots.
          $env:NOTEANYWHERE_DIR = Join-Path $env:RUNNER_TEMP "views"
          $settings = Join-Path $env:NOTEANYWHERE_DIR "settings.json"
          foreach ($shot in "calendar", "week", "day", "graph", "dark calendar", "dark graph") {
            if ($shot -like "dark *") {  # the first launch saved settings.json (the Welcome window has shown)
              $saved = Get-Content $settings -Raw | ConvertFrom-Json
              $saved.appearance = "dark"; $saved | ConvertTo-Json | Set-Content $settings
            }
            $app = Start-Process out\NoteAnywhere.exe -ArgumentList "--seed-sample-notes", "--view", $shot.Split(" ")[-1] -PassThru
            Start-Sleep -Seconds 15
            if ($app.HasExited) {
              $log = Join-Path $env:NOTEANYWHERE_DIR "crash.log"
              if (Test-Path $log) { Get-Content $log }
              throw "NoteAnywhere quit by itself on $shot, exit code $($app.ExitCode)"
            }
            & windows\scripts\Save-WindowShot.ps1 -ProcessId $app.Id -Title "NoteAnywhere" -Out "shots\$($shot.Replace(' ', '-'))-${{ matrix.rid }}.png"
            Stop-Process -Id $app.Id
            $app.WaitForExit()  # one instance at a time: a second would hand over to the first and quit
          }
          $log = Join-Path $env:NOTEANYWHERE_DIR "crash.log"
          if (Test-Path $log) { Get-Content $log; throw "NoteAnywhere logged an error" }
      - name: Follow the window in front (Notepad)
        shell: powershell
        run: |
          $file = Join-Path $env:RUNNER_TEMP "probe.txt"
          Set-Content -Path $file -Value "hello"
          $report = Join-Path $env:RUNNER_TEMP "front.jsonl"
          $probe = Start-Process out\NoteAnywhere.exe -ArgumentList "--report-front", $report, "20" -PassThru
          Start-Sleep -Seconds 4
          Start-Process notepad.exe -ArgumentList $file
          $probe.WaitForExit(40000) | Out-Null
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "What NoteAnywhere saw in front:"; Get-Content $report
          $seen = Get-Content $report | ConvertFrom-Json | Where-Object { $_.Target -like "win.notepad/probe.txt*" }
          if (-not $seen) { throw "NoteAnywhere didn't see probe.txt in Notepad come to the front" }
      - name: The panel opens beside Notepad
        shell: powershell
        run: |
          $env:NOTEANYWHERE_DIR = Join-Path $env:RUNNER_TEMP "store"  # the sample notes from the first step, one for probe.txt
          $file = Join-Path $env:RUNNER_TEMP "probe.txt"
          $app = Start-Process out\NoteAnywhere.exe -ArgumentList "--seed-sample-notes", "--background" -PassThru
          Start-Sleep -Seconds 8
          Add-Type -Namespace Probe -Name Front -MemberDefinition @'
          [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
          [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr w, System.Text.StringBuilder s, int n);
          [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr w);
          [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);
          [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr w, out uint pid);
          [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr w);
          public delegate bool EnumProc(IntPtr w, IntPtr data);
          [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc proc, IntPtr data);
          public static string[] Windows(uint process) {
            var found = new System.Collections.Generic.List<string>();
            EnumWindows((w, d) => {
              uint owner; GetWindowThreadProcessId(w, out owner);
              var text = new System.Text.StringBuilder(512); GetWindowText(w, text, 512);
              if (owner == process && text.Length > 0) found.Add((IsWindowVisible(w) ? "shown" : "hidden") + " '" + text + "'");
              return true;
            }, IntPtr.Zero);
            return found.ToArray();
          }
          '@
          # A second NoteAnywhere writes out each place its window watcher (the app's own code) sees come in front.
          $watched = Join-Path $env:RUNNER_TEMP "panel-front.jsonl"
          $watcher = Start-Process out\NoteAnywhere.exe -ArgumentList "--report-front", $watched, "90" -PassThru
          Start-Process notepad.exe -ArgumentList $file
          # GitHub's Arm64 machines put up a "Microsoft account" sign-in window (WWAHost), and Search's flyout, at moments
          # of their own, sometimes seconds after Notepad opens, and the panel rightly follows them: press Esc (which
          # closes either when it has the keyboard), end WWAHost, and bring Notepad forward (after an Alt press, as
          # Windows only lets the process with the last input change the window in front) until Notepad has stayed in
          # front for 3 s. Each new window in front is written out.
          $steady = 0; $last = ""
          foreach ($second in 1..40) {
            Start-Sleep -Seconds 1
            $window = [Probe.Front]::GetForegroundWindow()
            $front = New-Object System.Text.StringBuilder 512
            [void][Probe.Front]::GetWindowText($window, $front, 512)
            $owner = 0; [void][Probe.Front]::GetWindowThreadProcessId($window, [ref]$owner)
            $name = (Get-Process -Id $owner -ErrorAction SilentlyContinue).ProcessName
            if ($name -eq "Notepad") { if (++$steady -ge 3) { break }; continue }  # Notepad itself, not the panel titled for it
            $steady = 0
            $seen = "'$front' ($name)"
            if ($seen -ne $last) { Write-Host "in front: $seen"; $last = $seen }
            [Probe.Front]::keybd_event(0x1B, 0, 0, [UIntPtr]::Zero); [Probe.Front]::keybd_event(0x1B, 0, 2, [UIntPtr]::Zero)
            Get-Process WWAHost -ErrorAction SilentlyContinue | Stop-Process -Force
            $notepad = Get-Process notepad -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero } | Select-Object -First 1
            if ($notepad) {
              [Probe.Front]::keybd_event(0x12, 0, 0, [UIntPtr]::Zero); [Probe.Front]::keybd_event(0x12, 0, 2, [UIntPtr]::Zero)
              [void][Probe.Front]::SetForegroundWindow($notepad.MainWindowHandle)
            }
          }
          Write-Host "Notepad in front for $steady s"
          Start-Sleep -Seconds 5
          try { & windows\scripts\Save-WindowShot.ps1 -ProcessId $app.Id -Title "Notepad" -Out "shots\panel-${{ matrix.rid }}.png" }
          catch {
            # What was in front, and whether the app was still there: the panel only follows the window in front.
            Write-Host "NoteAnywhere still running: $(-not $app.HasExited)"
            $log = Join-Path $env:NOTEANYWHERE_DIR "crash.log"
            if (Test-Path $log) { Get-Content $log }
            $title = New-Object System.Text.StringBuilder 512
            [void][Probe.Front]::GetWindowText([Probe.Front]::GetForegroundWindow(), $title, 512)
            Write-Host "window in front: '$title'"
            Write-Host "NoteAnywhere's windows:"; [Probe.Front]::Windows([uint32]$app.Id) | ForEach-Object { Write-Host "  $_" }
            Write-Host "What its window watcher saw come in front:"; if (Test-Path $watched) { Get-Content $watched }
            throw
          }
          finally {
            Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
            Stop-Process -Id $app.Id -ErrorAction SilentlyContinue
            Stop-Process -Id $watcher.Id -ErrorAction SilentlyContinue
          }
      - name: Make the installer
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.161
          # --framework: Setup installs what a PC lacks: the WebView2 runtime the editor needs (older Windows 10), and the
          # Visual C++ runtime that ONNX Runtime (search, the writing model) loads, msvcp140.dll and the like.
          # NoteAnywhere.App, so the install folder (%LOCALAPPDATA%\NoteAnywhere.App) never holds the notes
          # (%LOCALAPPDATA%\NoteAnywhere): uninstalling removes the whole install folder.
          $frameworks = "webview2,vcredist143-" + "${{ matrix.rid }}".Substring(4)
          vpk pack --packId NoteAnywhere.App --packVersion (Get-Content VERSION).Trim() --packDir out --mainExe NoteAnywhere.exe `
            --packTitle NoteAnywhere --packAuthors NoteAnywhere --icon windows/src/NoteAnywhere/Assets/NoteAnywhere.ico `
            --runtime ${{ matrix.rid }} --channel ${{ matrix.rid }} --framework $frameworks --outputDir releases
          Get-ChildItem releases | Format-Table Name, Length
          # The same build as the next patch version, in a folder standing in for GitHub's releases (the update check below).
          $v = [version](Get-Content VERSION).Trim()
          vpk pack --packId NoteAnywhere.App --packVersion "$($v.Major).$($v.Minor).$($v.Build + 1)" --packDir out --mainExe NoteAnywhere.exe `
            --packTitle NoteAnywhere --packAuthors NoteAnywhere --icon windows/src/NoteAnywhere/Assets/NoteAnywhere.ico `
            --runtime ${{ matrix.rid }} --channel ${{ matrix.rid }} --framework $frameworks --outputDir feed
      - name: Install it as a person would
        shell: pwsh
        run: |
          $setup = (Get-ChildItem releases -Filter *Setup.exe | Select-Object -First 1).FullName
          # The Arm64 machines' desktop can start late and run the login items then, among them the CI build that an earlier
          # step's launch registered to open at login ("out\NoteAnywhere.exe" --background). The installed app would hand
          # over to that copy and quit, so it ends first.
          Get-Process NoteAnywhere -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "ending $($_.Path) $($_.CommandLine)"; $_ | Stop-Process -Force }
          Start-Process $setup -ArgumentList "--silent" -Wait
          Start-Sleep -Seconds 10
          $exe = Join-Path $env:LOCALAPPDATA "NoteAnywhere.App\current\NoteAnywhere.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem (Join-Path $env:LOCALAPPDATA "NoteAnywhere.App") -Recurse -Depth 1; throw "not installed at $exe" }
          Get-Process NoteAnywhere -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "after Setup, running: $($_.Path) $($_.CommandLine)" }
          if (-not (Get-Process NoteAnywhere -ErrorAction SilentlyContinue)) { Start-Process $exe -ArgumentList "--background"; Start-Sleep -Seconds 10 }
          $manifest = (Get-ItemProperty "HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.memorynotes.host").'(default)'
          $path = (Get-Content $manifest -Raw | ConvertFrom-Json).path
          Write-Host "Chrome's host manifest: $manifest -> $path"
          if ($path -ne $exe) {
            # The installed app registers at every start: say whether it runs, what it logged, and what Setup logged.
            Get-Process NoteAnywhere -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "running: $($_.Path) $($_.CommandLine)" }
            $log = Join-Path $env:LOCALAPPDATA "NoteAnywhere\crash.log"
            if (Test-Path $log) { Get-Content $log }
            Get-ChildItem (Join-Path $env:LOCALAPPDATA "NoteAnywhere.App"), $env:TEMP -Filter *.log -Recurse -Depth 2 -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like "*velopack*" -or $_.DirectoryName -like "*NoteAnywhere.App*" } |
              ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
            throw "Chrome would start $path, not the installed app"
          }
          Get-Process NoteAnywhere -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Update the installed copy to the next version
        shell: pwsh
        run: |
          $v = [version](Get-Content VERSION).Trim()
          $next = "$($v.Major).$($v.Minor).$($v.Build + 1)"
          $env:NOTEANYWHERE_UPDATES = (Resolve-Path feed).Path
          $env:NOTEANYWHERE_DIR = Join-Path $env:RUNNER_TEMP "update-store"
          $current = Join-Path $env:LOCALAPPDATA "NoteAnywhere.App\current"
          Start-Process (Join-Path $current "NoteAnywhere.exe") -ArgumentList "--background", "--update-now"
          $installed = { $f = Join-Path $current "sq.version"; if (Test-Path $f) { ([xml](Get-Content $f -Raw)).package.metadata.version } }
          foreach ($i in 1..60) { Start-Sleep -Seconds 2; if ((& $installed) -eq $next) { break } }
          Write-Host "installed version: $(& $installed)"
          if ((& $installed) -ne $next) {
            $log = Join-Path $env:NOTEANYWHERE_DIR "crash.log"
            if (Test-Path $log) { Get-Content $log }
            Get-ChildItem $current | Format-Table Name, Length
            throw "the installed copy didn't update to $next"
          }
          Start-Sleep -Seconds 10
          if (-not (Get-Process NoteAnywhere -ErrorAction SilentlyContinue)) { throw "the updated app didn't start again" }
          Get-Process NoteAnywhere -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shots-${{ matrix.rid }}
          path: shots/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-${{ matrix.rid }}
          path: releases/
