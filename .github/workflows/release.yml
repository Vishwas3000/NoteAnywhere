# On a vX.Y.Z tag: builds the notarized DMG and the Chrome Web Store zip with scripts/release.sh and attaches both to a
# GitHub Release. Repository secrets (how to make them: docs/RELEASING.md):
#   MACOS_CERTIFICATE_P12       base64 of the Developer ID Application certificate + private key (.p12)
#   MACOS_CERTIFICATE_PASSWORD  the .p12's export password
#   NOTARY_API_KEY              base64 of the App Store Connect API key (AuthKey_XXXXXXXXXX.p8)
#   NOTARY_API_KEY_ID           its Key ID
#   NOTARY_API_ISSUER_ID        the Issuer ID shown above the keys list
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # release.sh reads the version from the tag
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import the Developer ID certificate into a throwaway keychain
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/release.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN"
          # Sign with whichever Developer ID the .p12 holds; release.sh still checks it belongs to team GH5YVSN865.
          echo "NOTEANYWHERE_SIGN_ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')" >> "$GITHUB_ENV"

      - name: Save the notarytool credentials as the NoteAnywhere profile
        env:
          API_KEY: ${{ secrets.NOTARY_API_KEY }}
          KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials NoteAnywhere --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER"
          rm "$RUNNER_TEMP/AuthKey.p8"

      - run: scripts/release.sh

      - name: Attach the DMG and the extension zip to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip --title "NoteAnywhere ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Delete the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
