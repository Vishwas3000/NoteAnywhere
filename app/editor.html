<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="mn-editor.css">
<style>
  html, body { margin: 0; background: transparent; }
  body { padding: 0 2px; }
  /* A note filling a window: the web view is full width (scroll bar at the edge), the text a centred column. */
  body.page #editor { max-width: 720px; margin: 0 auto; padding: 0 40px; }
</style>
</head>
<body>
<div id="editor"></div>
<script src="mn-editor.js"></script>
<script>
  // Bridge for EditorView.swift. Every edit goes straight to Swift, which saves it, so switching notes loses nothing.
  let editor, asked = 0;
  const pending = new Map();  // requests waiting for Swift: ✨ (the on-device model), pages, note search and previews
  const post = (msg) => webkit.messageHandlers.mn.postMessage(msg);
  const ask = (type, fields) => new Promise((resolve, reject) => {
    const id = ++asked;
    pending.set(id, { resolve, reject });
    post({ type, id, ...fields });
  });
  window.MNHost = {
    // options: { toolbar, fontSize, titleLine, page, datePattern, pages }
    load(markdown, options) {
      editor?.destroy();
      document.body.classList.toggle("page", !!options.page);
      editor = MNEditor.mount(document.getElementById("editor"), {
        markdown, ...options, placeholder: "Write a note…",
        onChange: (md) => post({ type: "change", markdown: md }),
        onLinkNote: (id) => post({ type: "openNote", id }),
        onTag: (tag) => post({ type: "tag", tag }),
        onDate: (day) => post({ type: "date", day }),
        onHeight: (px) => post({ type: "height", value: px }),
        onAI: (action, text) => ask("ai", { action, text }),
        onAddImage: (mime, data) => ask("addImage", { mime, data }),  // shown through ImageScheme (noteimage:)
        // The Mac app makes pages from highlighted text, finds notes to link and previews them on hover.
        ...(options.pages ? {
          onAddPage: (text) => ask("addPage", { text }),
          onFindNotes: (query) => ask("findNotes", { query }),
          onNotePreview: (id) => ask("notePreview", { note: id }),
        } : {}),
      });
    },
    reply(id, value, error) {
      const p = pending.get(id);
      pending.delete(id);
      error == null ? p?.resolve(value) : p?.reject(new Error(error));
    },
    aiDone(id, text, error) { this.reply(id, text, error); },  // the iPhone app's name for reply
    set(markdown) { if (editor && editor.getMarkdown() !== markdown) editor.setMarkdown(markdown); },
    focus() { editor?.focus(); },
  };
  post({ type: "ready" });
</script>
</body>
</html>
