<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="mn-editor.css">
<style>
  html, body { margin: 0; background: transparent; }
  body { padding: 0 2px; }
  /* A note filling a window: the web view is full width (scroll bar at the edge), the text a centred column. */
  body.page #editor { max-width: 720px; margin: 0 auto; padding: 0 40px; }
</style>
</head>
<body>
<div id="editor"></div>
<script src="mn-editor.js"></script>
<script>
  // Bridge for EditorView.swift. Every edit goes straight to Swift, which saves it, so switching notes loses nothing.
  let editor, aiCount = 0;
  const aiPending = new Map();  // ✨ requests waiting for Swift to run the on-device model
  const post = (msg) => webkit.messageHandlers.mn.postMessage(msg);
  window.MNHost = {
    // options: { toolbar, fontSize, titleLine, page }
    load(markdown, options) {
      editor?.destroy();
      document.body.classList.toggle("page", !!options.page);
      editor = MNEditor.mount(document.getElementById("editor"), {
        markdown, ...options, placeholder: "Write a note…",
        onChange: (md) => post({ type: "change", markdown: md }),
        onLinkNote: (id) => post({ type: "openNote", id }),
        onTag: (tag) => post({ type: "tag", tag }),
        onDate: (day) => post({ type: "date", day }),
        onHeight: (px) => post({ type: "height", value: px }),
        onAI: (action, text) => new Promise((resolve, reject) => {
          const id = ++aiCount;
          aiPending.set(id, { resolve, reject });
          post({ type: "ai", id, action, text });
        }),
      });
    },
    aiDone(id, text, error) {
      const p = aiPending.get(id);
      aiPending.delete(id);
      error == null ? p?.resolve(text) : p?.reject(new Error(error));
    },
    set(markdown) { if (editor && editor.getMarkdown() !== markdown) editor.setMarkdown(markdown); },
    focus() { editor?.focus(); },
  };
  post({ type: "ready" });
</script>
</body>
</html>
